[workspace]
resolver = "3"
members = ["crates/blazer-core", "crates/blazer-cli", "crates/blazer-host", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blazer-core = { path = "crates/blazer-core" }
blazer-host = { path = "crates/blazer-host" }

anyhow = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
file_icon_provider = "1"
fastrand = "2"
futures-util = "0.3"
httpdate = "1"
libc = "0.2"
parking_lot = "0.12"
percent-encoding = "2"
png = "0.18"
redb = "4.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
