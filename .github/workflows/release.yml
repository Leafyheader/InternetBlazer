name: Release

# Pushing a tag such as v0.2.0 builds the full installer and the smaller update installer, and
# drafts a release with both and latest.json. Publishing the draft makes it the update that
# installed copies pick up.
on:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # The update: the app without yt-dlp, deno and ffmpeg, which installed copies keep. Each
      # update stays small; the app fetches any tool an install is missing.
      - name: Build the update
        run: npm run package:update
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Keep the update aside
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for ext in "" ".sig"; do
            mv "target/release/bundle/nsis/InternetBlazer_${v}_x64-setup.exe$ext"               "release/InternetBlazer_${v}_x64-update.exe$ext"
          done
      # The installer people download: the app with yt-dlp, deno and ffmpeg, so videos work
      # without fetching anything.
      - name: Build the installer
        run: npm run package
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Point latest.json at the update
        run: node app/scripts/latest-json.mjs "${{ github.ref_name }}" release
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft             --title "InternetBlazer $GITHUB_REF_NAME"             --notes "See the commits since the last release for what changed."             "target/release/bundle/nsis/InternetBlazer_${v}_x64-setup.exe"             "release/InternetBlazer_${v}_x64-update.exe"             release/latest.json
